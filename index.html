<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4a9be8" />
    <meta name="description" content="스케치북에 그린 그림이 뭉게구름이 되어 하늘로 떠올라요." />
    <title>하늘 스케치북</title>
  </head>
  <body>
    <canvas id="sky" aria-label="구름이 떠다니는 하늘"></canvas>

    <section class="book" aria-label="스케치북">
      <div class="rings" aria-hidden="true"></div>
      <div class="paper">
        <canvas id="pad" aria-label="여기에 그림을 그려요"></canvas>
        <p class="hint" id="hint">여기에 그려 보세요</p>
      </div>
      <div class="tools">
        <button type="button" id="clear" class="ghost">지우기</button>
        <div class="share">
          <label class="check"><input type="checkbox" id="share" checked /> 다른 사람 하늘에도 띄우기</label>
          <input type="text" id="nick" maxlength="10" placeholder="닉네임(선택)" autocomplete="nickname" aria-label="구름 아래에 보일 닉네임, 10자 이내" />
        </div>
        <button type="button" id="send" class="primary" disabled>하늘로 보내기</button>
      </div>
    </section>

    <canvas id="fx" aria-hidden="true"></canvas>
    <p id="toast" class="toast" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
